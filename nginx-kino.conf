# HTTP + HTTPS for kino.barasek.net
# :443 is Remnawave Reality (VPN). Browser TLS with SNI=kino.barasek.net
# is self-stolen to nginx :8443. Do NOT bind nginx to :443.
# Requires conf.d/kino-cache.conf (proxy_cache_path + gzip).

server {
    listen 80;
    listen [::]:80;
    server_name kino.barasek.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Real TLS for the site (Reality dest + optional direct :8443)
server {
    listen 127.0.0.1:8443 ssl http2;
    listen 0.0.0.0:8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name kino.barasek.net;

    ssl_certificate     /etc/letsencrypt/live/kino.barasek.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kino.barasek.net/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 5m;

    # Long-cache for hashed Vite assets
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    # Image proxy + nginx disk cache (zone from conf.d/kino-cache.conf)
    location ^~ /api/img {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache kino_img;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_pass_header ETag;
    }
}
