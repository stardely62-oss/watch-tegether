# Production compose — does NOT bind 443 (VPN/remnawave stays untouched)
services:
  watch-together:
    build: .
    container_name: watch-together
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
    volumes:
      - watch_together_data:/app/server/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3001/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  watch_together_data:
